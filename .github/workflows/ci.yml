name: CI

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/requirements.txt
      # 冒烟测试：确认研究脚本能跑通；正式数字由维护者用完整模式生成并提交
      - run: python research/compute_numbers.py --quick --out /tmp/numbers.json
